    <title>Medical Writing & Bioinformatics Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
        }
        h1, h2, h3, .heading-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        ::selection {
            background: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }
        
        /* Border Beam Effect */
        @keyframes beam {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .border-beam-container {
            position: relative;
            overflow: hidden;
        }
        .border-beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #10b981, transparent);
            animation: beam 3s infinite linear;
        }

        /* Hover Glow Effect */
        .hover-glow:hover {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            border-color: rgba(16, 185, 129, 0.5);
        }
    </style>
